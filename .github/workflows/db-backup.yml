name: Daily DB Backup

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 한국시간 새벽 3시
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client (Latest)
        run: |
          sudo apt-get update
          # 버전 명시 없이 설치 (기본적으로 최신 안정 버전인 16 또는 17이 설치됨)
          sudo apt-get install -y postgresql-client

      - name: Test Connection
        env:
          DATABASE_URL: ${{ secrets.SAJU_DATABASE_URL }}
        run: |
          echo "🔍 연결 테스트 중..."
          psql "$DATABASE_URL" -c "SELECT version();"

      - name: Dump Database
        env:
          DATABASE_URL: ${{ secrets.SAJU_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          pg_dump "$DATABASE_URL" --no-owner --no-acl -Fc > backup_${TIMESTAMP}.dump
          echo "✅ 백업 완료: backup_${TIMESTAMP}.dump"

      - name: Upload Backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup_*.dump
          retention-days: 90