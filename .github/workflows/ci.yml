name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 일회용 PostgreSQL 컨테이너 (외부 DB와 무관, job 이 끝나면 사라짐)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saju
          POSTGRES_PASSWORD: saju_test
          POSTGRES_DB: saju_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saju -d saju_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/test_repository_backends.py 가 이 값을 보면 SQLite + PostgreSQL 두 백엔드로 실행
      SAJU_TEST_DATABASE_URL: postgresql://saju:saju_test@localhost:5432/saju_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Dockerfile(python:3.12-slim)과 동일하게 맞춤
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: i18n keys guardrail
        run: python scripts/verify_i18n.py

      - name: i18n tone guardrail
        run: python scripts/verify_i18n_tone.py

      - name: Tests (SQLite + PostgreSQL)
        run: python -m pytest -q
