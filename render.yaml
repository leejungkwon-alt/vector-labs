services:
  - type: web
    name: vector-labs-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SAJU_ENV
        value: production
      - key: SAJU_JWT_SECRET
        generateValue: true
      - key: SAJU_ASSET_BASE_URL
        value: /wallpapers/
      - key: SAJU_CORS_ORIGINS
        value: https://vector-labs.vercel.app