<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SAJU Premium 3D Core</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030305; }
    canvas { display: block; }
  </style>
  <!-- 최신 Three.js 모듈 로드 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // 1. 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // 2. 환경 맵 생성 (외부 파일 없이 코드로 고급 반사광 생성)
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    // 3. 메인 유리 구체 (Outer Glass)
    const sphereGeo = new THREE.SphereGeometry(2.2, 64, 64);
    const sphereMat = new THREE.MeshPhysicalMaterial({
      color: 0x2ecc71,        // 목(Wood) 에너지 컬러
      metalness: 0.1,
      roughness: 0.05,
      transmission: 1.0,      // 완벽한 유리 투명도
      thickness: 2.0,
      ior: 1.5,               // 유리 굴절률
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      envMapIntensity: 2.0,
      emissive: 0x0a3315,     // 내부 은은한 발광
      emissiveIntensity: 0.3
    });
    const orb = new THREE.Mesh(sphereGeo, sphereMat);
    scene.add(orb);

    // 4. 내부의 살아있는 에너지 코어 (Inner Core)
    const coreGeo = new THREE.IcosahedronGeometry(0.9, 2);
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      emissive: 0x55ff88,     // 코어 발광 색상
      emissiveIntensity: 2.5,
      wireframe: true,        // 기하학적 에너지 느낌
      transparent: true,
      opacity: 0.8
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    orb.add(core); // 유리 구체 안에 배치

    // 5. 빛 번짐(Bloom) 후처리 효과 (압도적인 프리미엄 감성)
    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.5,  // 빛 번짐 강도
      0.4,  // 번짐 반경
      0.85  // 임계값 (이 값보다 밝은 부분만 번짐)
    );
    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    // 6. 애니메이션 루프 (살아 숨쉬는 움직임)
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // 구체가 둥둥 떠다니는 효과
      orb.position.y = Math.sin(time * 1.5) * 0.2;
      orb.rotation.y = time * 0.1;

      // 내부 코어 회전 및 맥동 효과 (살아있는 느낌)
      core.rotation.y = -time * 0.5;
      core.rotation.x = time * 0.3;
      const pulse = 1 + Math.sin(time * 3) * 0.05;
      core.scale.set(pulse, pulse, pulse);

      composer.render();
    }
    animate();

    // 창 크기 변경 대응
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
